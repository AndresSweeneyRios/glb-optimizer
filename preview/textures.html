<!doctype html><html lang="en"><meta charset="utf-8"><title>Baked albedo atlas</title><link rel="icon" href="data:,"><style>body{margin:0;background:#111318;color:#e8edf0;font:16px system-ui;padding:1.5em}header{display:flex;gap:1.5em;align-items:center;margin-bottom:1em}h1{font-size:1.3em;margin:0}button{font:inherit;color:inherit;background:#29353e;border:1px solid #627681;border-radius:.3em;padding:.5em 1em;cursor:pointer}canvas{display:block;width:min(90vw,85vh);height:auto;border:1px solid #627681}p{color:#a5b5bf}</style><script type="importmap">{"imports":{"three":"/three/build/three.module.js","three/addons/":"/three/examples/jsm/"}}</script><header><h1>Albedo atlas</h1><button id="download" disabled>Download PNG</button><span id="status">Loading…</span></header><canvas></canvas><p>All source albedo colors and textures, including the palette tiles, with 16px mirrored bleed. No scene lighting or tone mapping.</p><script type="module">
import * as THREE from 'three';import{GLTFLoader}from'three/addons/loaders/GLTFLoader.js';import{DRACOLoader}from'three/addons/loaders/DRACOLoader.js';import{KTX2Loader}from'three/addons/loaders/KTX2Loader.js';
const canvas=document.querySelector('canvas'),renderer=new THREE.WebGLRenderer({canvas,preserveDrawingBuffer:true});renderer.toneMapping=THREE.NoToneMapping;
const ktx=new KTX2Loader().setTranscoderPath('/three/examples/jsm/libs/basis/').detectSupport(renderer),draco=new DRACOLoader().setDecoderPath('/three/examples/jsm/libs/draco/gltf/');
try{const gltf=await new GLTFLoader().setKTX2Loader(ktx).setDRACOLoader(draco).register(()=>({name:'EXT_glb_optimizer_atlas'})).loadAsync('/optimized.glb');let map;gltf.scene.traverse(o=>{if(o.isMesh&&o.material.map)map=o.material.map});if(!map)throw Error('No albedo texture found');const{width,height}=map.image;renderer.setSize(width,height,false);const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-1,1,1,-1,0,2),geometry=new THREE.PlaneGeometry(2,2),uv=geometry.getAttribute('uv');for(let i=0;i<uv.count;i++)uv.setY(i,1-uv.getY(i));scene.add(new THREE.Mesh(geometry,new THREE.MeshBasicMaterial({map,toneMapped:false})));camera.position.z=1;renderer.render(scene,camera);document.querySelector('#status').textContent=`${width} × ${height}`;const button=document.querySelector('#download');button.disabled=false;button.onclick=()=>canvas.toBlob(blob=>{const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='table-albedo-atlas.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)});ktx.dispose();draco.dispose();}catch(error){document.querySelector('#status').textContent=String(error);console.error(error)}
</script></html>
